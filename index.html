<html lang="en"><head><meta charset="utf-8">

<style>

</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="lv"></span><span id="tm"></span><span id="ps"></span></div>
<button id="mt">🔊</button>
<div id="ov"><div class="card"><h1 id="h">Tilt Trail Race</h1><p id="msg"></p>
<div id="sw"></div><div id="tr"></div><div id="inp"><input id="nm" maxlength="12" placeholder="Your name" autocomplete="off"><input id="rm" maxlength="20" placeholder="Room code (blank = solo)" autocomplete="off"></div>
<div id="lvp"><input id="lvn" type="number" min="1" max="100" placeholder="Level (1-100)"></div><ul id="board"></ul><button id="go">Play</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const NL=100,LV=[],PEN=5000,HUES=[4,28,50,140,190,215,270,320];
for(let n=0;n<NL;n++){const t=n/(NL-1);LV.push(n%5!==4?{name:'Circuit '+(n+1),loop:1,laps:n<30?3:2,kx:2.3+1.2*t,ky:4+6*t,w:.11-.055*t,seed:n*37+5,amp:.12+.22*t,M:14+Math.round(26*t),t}:{name:'Sprint '+(n+1),loop:0,laps:1,kx:2.3+.9*t,ky:5+5*t,w:.105-.05*t,seed:n*37+5,t})}
const PU_DUR=8000,WALL_LIFE=5000;
let WW=1,camx=0,pickups=[],puUntil=0,walls=new Map(),trackPath=null,thudAt=0,ac=null,mute=false;
let W,H,PW,ox,S,dpr,lvl=0,worldH=1,path=[],halfW=40,ball=null,state='menu',cam=0,t0=0,time=0,pen=0,total=0,lastIdx=0,portals=[],noPortal=0,msgUntil=0,buf=new Map(),frozenUntil=0,startAt=0,doneT=0,ovOn=true,frame=0,tk=0;
let tilt={x:0,y:0},drag=null,keys={},myName='Player',myHue=HUES[Math.random()*8|0],code='',myTr=1,myTrail=[],otrail=new Map(),wrongSince=0,wrong=false;
let net=null,peer=null,hostConn=null,conns=[],others=new Map(),meSt={},myId='',lostHost=false,raceId=0,raceL=0,lastRace=null,lastStartT=0;
const r3=v=>Math.round(v*1000)/1000,num=v=>Number.isFinite(+v)?+v:0;
const hc=(h,l)=>'hsl('+((+h||0)%360)+',75%,'+(l||55)+'%)';
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function cr(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return[0,1].map(i=>.5*((2*p1[i])+(-p0[i]+p2[i])*t+(2*p0[i]-5*p1[i]+4*p2[i]-p3[i])*t2+(-p0[i]+3*p1[i]-3*p2[i]+p3[i])*t3))}
const ballR=()=>Math.max(6,Math.min(11*S+3,halfW*.45));
function build(){
 const L=LV[lvl];worldH=H*L.ky;WW=Math.max(W*1.8,PW*L.kx);halfW=L.w*PW;const r=rng(L.seed*131+7);let Q=[];
 if(L.loop){const M=L.M,ph=r()*6.28;for(let j=0;j<M;j++){const a=-Math.PI/2+6.2832*j/M,fx=1+L.amp*(Math.sin(2*a+ph)*.5+(r()*2-1)*.7),fy=1+L.amp*.3*(r()*2-1);Q.push([Math.max(.08,Math.min(.92,.5+.4*Math.cos(a)*fx)),Math.max(.05,Math.min(.95,.5+.43*Math.sin(a)*fy))])}}
 else{const gap=Math.max(120,5.2*halfW,.22*.76*WW),rows=Math.max(6,Math.floor(worldH*.82/gap));Q.push([.5,.02]);for(let i=0;i<rows;i++)Q.push([(i%2?.88:.12)+(r()-.5)*.1,.06+.9*i/(rows-1)]);Q.push([.5,.985])}
 Q=Q.map(q=>[q[0]*WW,q[1]*worldH]);const n=Q.length,lp=L.loop;path=[];
 for(let i=0;i<(lp?n:n-1);i++){const a=lp?Q[(i+n-1)%n]:Q[Math.max(i-1,0)],b=Q[i],c=lp?Q[(i+1)%n]:Q[i+1],d=lp?Q[(i+2)%n]:Q[Math.min(i+2,n-1)];const ns=Math.max(8,Math.ceil(Math.hypot(c[0]-b[0],c[1]-b[1])/14));for(let k=0;k<ns;k++)path.push(cr(a,b,c,d,k/ns))}
 if(!lp)path.push(Q[n-1]);
 trackPath=new Path2D();path.forEach((p,i)=>i?trackPath.lineTo(p[0],p[1]):trackPath.moveTo(p[0],p[1]));if(lp)trackPath.closePath();
 const N=path.length,Lpx=N*13,pc=Math.max(3,Math.round(Lpx/(1000-300*L.t)));portals=[];
 for(let j=0;j<pc;j++){const idx=Math.floor(N*(.15+.7*(j+.2+.6*r())/pc)),back=Math.min(Math.floor(N*(.07+.05*r())),55+Math.floor(r()*35)),a=path[idx-1],b=path[idx+1],tx=b[0]-a[0],ty=b[1]-a[1],l=Math.hypot(tx,ty)||1,sd=j%2?1:-1;
  const br=ballR(),rp=Math.max(halfW*.2,Math.min(halfW*.42,(2*halfW-2*br-5)/2)),of=halfW-rp;portals.push({x:path[idx][0]-ty/l*sd*of,y:path[idx][1]+tx/l*sd*of,r:rp,idx,back})}
 pickups=[];const pk=Math.max(3,Math.round(Lpx/1400));
 for(let j=0;j<pk;j++){let idx=Math.floor(N*(.1+.8*(j+.5)/pk));for(const p of portals)if(Math.abs(p.idx-idx)<9)idx+=12;idx=Math.min(N-3,idx);pickups.push({x:path[idx][0],y:path[idx][1],r:Math.max(8,halfW*.42),idx,until:0})}}
function resize(){
 let nx,ny;if(ball){nx=ball.x/WW;ny=ball.y/worldH}
 dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 PW=Math.min(W,H*.62);S=PW/400;build();
 if(ball){ball.x=nx*WW;ball.y=ny*worldH;ball.r=ballR()}}
function nearest(x,y){let best=1e9,bi=0,bx=0,by=0;const n=path.length,m=LV[lvl].loop?n:n-1;
 for(let i=0;i<m;i++){const[ax,ay]=path[i],[cx,cy]=path[(i+1)%n],dx=cx-ax,dy=cy-ay;let u=((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy||1);u=Math.max(0,Math.min(1,u));
  const px=ax+u*dx,py=ay+u*dy,d=Math.hypot(x-px,y-py);if(d<best){best=d;bi=(i+(u>.5?1:0))%n;bx=px;by=py}}
 return[best,bi,bx,by]}
function spawn(){const p=path[0],a=path[1],b=LV[lvl].loop?path[path.length-1]:p,tx=a[0]-b[0],ty=a[1]-b[1],tl=Math.hypot(tx,ty)||1;ball={x:p[0],y:p[1],vx:0,vy:0,r:ballR(),tx:tx/tl,ty:ty/tl};cam=Math.max(0,Math.min(worldH-H,p[1]-H/2));camx=Math.max(0,Math.min(WW-W,p[0]-W/2))}
const target=()=>LV[lvl].loop?LV[lvl].laps*path.length:path.length-1;
const prog=()=>Math.max(0,Math.min(1,total/Math.max(1,target())));
function pres(v){Object.assign(meSt,v)}
function beginRace(l){lvl=l;build();pen=0;total=0;lastIdx=0;noPortal=0;buf.clear();myTrail.length=0;otrail.clear();walls.clear();puUntil=0;wrongSince=0;wrong=false;doneT=0;time=0;spawn();state='count';startAt=performance.now()+3000;
 pres({l:lvl,d:0,g:0,pn:0,f:0});show(false)}
function hostStart(l){const n=performance.now();if(n-lastStartT<1000)return;lastStartT=n;raceId++;raceL=l;beginRace(l)}
function requestRace(l){if(net==='host')hostStart(l);else if(net==='client'&&hostConn&&hostConn.open){[0,120,240].forEach(w=>setTimeout(()=>hostConn.open&&hostConn.send({t:'start',l}),w))}else beginRace(l)}
function show(on){ovOn=on;$('ov').style.display=on?'flex':'none'}
const sc=r=>r.d>0?2+1/(1+r.d):r.g;
function rows(){
 const a=[{n:myName,c:myHue,g:prog(),d:doneT,pn:pen,me:1}];
 others.forEach(o=>{if(o.n)a.push({n:o.n,c:o.c,g:o.g,d:o.d,pn:o.pn,me:0})});
 return a.sort((x,y)=>sc(y)-sc(x))}
function renderBoard(){const ul=$('board');ul.textContent='';if(state==='menu')return;
 if(net&&state==='lobby'){const n=rows().length;$('msg').textContent='Room '+code+': '+n+' player'+(n==1?'':'s')+' here. Friends open this same page and enter the same code. Anyone can press Start.'}
 rows().forEach((r,i)=>{const li=document.createElement('li'),dt=document.createElement('span');dt.className='dot';dt.style.background=hc(r.c);li.appendChild(dt);
  li.appendChild(document.createTextNode((state==='done'?(i+1)+'. ':'')+r.n+(r.me?' (you)':'')+' — '+(r.d>0?r.d.toFixed(1)+'s':state==='lobby'?'ready':Math.round(r.g*100)+'%')));ul.appendChild(li)})}
function readLevel(){return Math.max(0,Math.min(NL-1,(parseInt($('lvn').value)||1)-1))}
function card(h,msg,btn,menu){$('lvp').style.display=state==='lobby'||state==='done'?'block':'none';$('lvn').value=state==='done'?Math.min(NL,lvl+2):lvl+1;$('sw').style.display=$('tr').style.display=menu||state==='lobby'?'block':'none';$('h').textContent=h;$('msg').textContent=msg;$('go').textContent=btn;$('go').disabled=false;$('inp').style.display=menu?'block':'none';renderBoard();show(true)}
const TRN=['None','Comet','Rainbow','Sparkle'];
function trailBtns(){const b=$('tr');b.textContent='';const l=document.createElement('span');l.textContent='Trail effect';b.appendChild(l);
 TRN.forEach((nm,i)=>{const x=document.createElement('button');x.textContent=nm;x.className=i===myTr?'on':'';x.onclick=()=>{myTr=i;pres({tr:i});trailBtns()};b.appendChild(x)})}
function pushTrail(a,x,y,nt){const l=a[a.length-1];if(l){const d=Math.hypot(x-l.x,y-l.y);if(d>90)a.length=0;else if(d<2)return}a.push({x,y,t:nt,h:(nt/4)%360,s:Math.random()})}
function drawTrail(a,mode,hue,r,nt){while(a.length&&nt-a[0].t>650)a.shift();if(!mode)return;
 for(let i=0;i<a.length;i++){const p=a[i],f=1-(nt-p.t)/650;if(f<=0)continue;
  if(mode===1)dot(p.x,p.y,r*(.25+.7*f),hc(hue,60),.45*f);
  else if(mode===2)dot(p.x,p.y,r*(.3+.6*f),'hsl('+(p.h|0)+',90%,60%)',.6*f);
  else{const o=r*(1.6-f*1.2);dot(p.x+Math.cos(p.s*6.283)*o,p.y+Math.sin(p.s*6.283)*o,2+3*f,i%2?'#fff':hc(hue,70),.9*f)}}}
function swatches(){const b=$('sw');b.textContent='';HUES.forEach(h=>{const x=document.createElement('button');x.style.background=hc(h);x.className=h===myHue?'on':'';x.onclick=()=>{myHue=h;pres({c:h});swatches();if(ovOn)renderBoard()};b.appendChild(x)})}
/* ---------- multiplayer (PeerJS): first player to use a code is the host ---------- */
function clean(s){s=s||{};return{pu:s.pu?1:0,tr:Math.max(0,Math.min(3,num(s.tr)|0)),t:performance.now(),q:num(s.q),u:num(s.u),v:num(s.v),n:String(s.n||'').slice(0,12),c:num(s.c),l:num(s.l),x:num(s.x),y:num(s.y),g:num(s.g),pn:num(s.pn),f:s.f?1:0,d:num(s.d)}}
function goLobby(h,msg){state='lobby';card(h,msg,'Start race',false)}
function fail(e){net=null;try{peer&&peer.destroy()}catch(_){}peer=null;goLobby('Solo race','Couldn\'t reach the multiplayer server ('+((e&&e.type)||'timeout')+'). You\'re racing solo.')}
function hostLost(){if(net!=='client')return;net=null;others=new Map();lostHost=true;if(state==='lobby'||state==='done')card('Host left','The host closed the game, so you\'re solo now. Reload to join again.','Start race',false)}
function newer(id,s,from){const o=from.get(id),n=clean(s);return o&&n.q<=o.q?o:n}
function onData(d){if(!d||d.t!=='all'||!d.p)return;
 const m=new Map();for(const k in d.p)if(k!==myId)m.set(k,newer(k,d.p[k],others));others=m;
 if(lastRace===null)lastRace=d.r;else if(d.r!==lastRace){lastRace=d.r;beginRace(num(d.l)%LV.length)}}
function onClient(c){
 c.on('open',()=>{conns.push(c);others.set(c.peer,clean({}))});
 c.on('data',d=>{if(!d)return;if(d.t==='st')others.set(c.peer,newer(c.peer,d.s,others));else if(d.t==='start')hostStart(num(d.l)%LV.length)});
 const gone=()=>{others.delete(c.peer);conns=conns.filter(x=>x!==c)};c.on('close',gone);c.on('error',gone)}
function joinAsClient(id){
 const cp=new Peer();let ok=false;const to=setTimeout(()=>{if(!ok)fail()},9000);
 cp.on('open',pid=>{myId=pid;const c=cp.connect(id,{reliable:false,serialization:'json'});
  c.on('open',()=>{ok=true;clearTimeout(to);peer=cp;net='client';hostConn=c;goLobby('Room '+code,'Joined!')});
  c.on('data',onData);c.on('close',hostLost);c.on('error',()=>{if(!ok){clearTimeout(to);fail()}})});
 cp.on('error',e=>{if(!ok){clearTimeout(to);fail(e)}})}
function connect(){
 const id='ttrace-v1-'+code,hp=new Peer(id);let settled=false;
 const to=setTimeout(()=>{if(!settled){settled=true;fail()}},9000);
 hp.on('open',()=>{if(settled)return;settled=true;clearTimeout(to);peer=hp;net='host';myId='host';others=new Map();conns=[];hp.on('connection',onClient);goLobby('Room '+code,'You\'re the host.')});
 hp.on('error',e=>{if(settled)return;settled=true;clearTimeout(to);try{hp.destroy()}catch(_){}
  if(e&&e.type==='unavailable-id')joinAsClient(id);else fail(e)})}
function doJoin(){
 myName=($('nm').value.trim()||'Player').slice(0,12);code=$('rm').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
 meSt={pu:0,tr:myTr,n:myName,c:myHue,l:lvl,x:0,y:0,g:0,pn:0,f:0,d:0,u:0,v:0,q:0};lastRace=null;raceId=0;
 if(!code){goLobby('Solo race','Race the clock!');return}
 if(typeof Peer==='undefined'){goLobby('Solo race','Couldn\'t load the multiplayer library, so you\'re racing solo.');return}
 $('go').disabled=true;$('msg').textContent='Connecting to room '+code+'…';connect()}
setInterval(()=>{if(!net)return;meSt.q=(meSt.q||0)+1;
 if(net==='client'){if(hostConn&&hostConn.open)hostConn.send({t:'st',s:meSt})}
 else{const all={host:meSt};others.forEach((v,k)=>all[k]=v);conns.forEach(c=>c.open&&c.send({t:'all',p:all,r:raceId,l:raceL}))}
 if(ovOn&&++tk%8==0)renderBoard()},33);
/* ---------- input ---------- */
$('go').onclick=()=>{aud();if(state==='menu')doJoin();else if(state==='lobby'||state==='done')requestRace(readLevel())};
addEventListener('pointerdown',e=>{aud();if(!ovOn&&e.target.id!=='mt')drag=[e.clientX,e.clientY]});
$('mt').onclick=()=>{mute=!mute;$('mt').textContent=mute?'🔇':'🔊';if(!mute)aud()};
addEventListener('pointermove',e=>{if(drag){tilt.x=Math.max(-1.5,Math.min(1.5,(e.clientX-drag[0])/70));tilt.y=Math.max(-1.5,Math.min(1.5,(e.clientY-drag[1])/70))}});
addEventListener('pointerup',()=>{drag=null;tilt.x=tilt.y=0});
addEventListener('keydown',e=>{if(!ovOn)keys[e.key]=1});addEventListener('keyup',e=>keys[e.key]=0);
addEventListener('resize',resize);
/* ---------- sound ---------- */
function aud(){if(mute)return null;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){ac=null}return ac}
function tone(f0,f1,dur,type,vol){const a=aud();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur)}catch(e){}}
const portalSfx=v=>{tone(950,80,.5,'sawtooth',.16*v);setTimeout(()=>tone(320,50,.4,'sine',.22*v),70)};
const puSfx=()=>{tone(500,1000,.16,'square',.09);setTimeout(()=>tone(800,1600,.2,'square',.09),100)};
function pushWall(id,x,y,hue,nt){let a=walls.get(id);if(!a){a=[];walls.set(id,a)}const l=a[a.length-1],wr=Math.max(6,halfW*.9);if(!l||Math.hypot(x-l.x,y-l.y)>wr*1.1)a.push({x,y,t:nt,c:hue,r:wr})}
/* ---------- game loop ---------- */
function step(){
 const now=performance.now();frame++;
 if(!drag){tilt.x=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);tilt.y=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0)}
 if(state==='count'&&now>=startAt){state='play';t0=now}
 if(state==='frozen'&&now>=frozenUntil)state='play';
 if(state==='play'){
  ball.vx+=tilt.x*.32*S;ball.vy+=tilt.y*.32*S;ball.vx*=.985;ball.vy*=.985;
  const m=9*S,sp=Math.hypot(ball.vx,ball.vy);if(sp>m){ball.vx*=m/sp;ball.vy*=m/sp}
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x<ball.r||ball.x>WW-ball.r){ball.x=Math.max(ball.r,Math.min(WW-ball.r,ball.x));ball.vx*=-.4}
  if(ball.y<ball.r||ball.y>worldH-ball.r){ball.y=Math.max(ball.r,Math.min(worldH-ball.r,ball.y));ball.vy*=-.4}
  let pushed=false;
  for(const[id,a]of walls){if(id==='me')continue;for(const w of a){if(now-w.t>WALL_LIFE)continue;const dx=ball.x-w.x,dy=ball.y-w.y,dd=Math.hypot(dx,dy),mr=ball.r+w.r;
