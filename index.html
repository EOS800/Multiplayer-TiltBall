<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tilt Trail Race</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#eef1f5;--track:#fff;--edge:#c5ccd8;--ball:#e8553d;--goal:#2fa86b;--ink:#1d2330;--card:#fffffff2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141922;--track:#2a3345;--edge:#3b465c;--ink:#e8ecf4;--card:#1e2533f2}}
:root[data-theme="dark"]{--bg:#141922;--track:#2a3345;--edge:#3b465c;--ink:#e8ecf4;--card:#1e2533f2}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:10px 14px;font-weight:600;font-size:14px;pointer-events:none;text-shadow:0 0 6px var(--bg),0 0 6px var(--bg)}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0006;padding:16px}
.card{background:var(--card);border-radius:18px;padding:22px;width:290px;max-height:90%;overflow:auto;text-align:center;box-shadow:0 8px 30px #0004}
.card h1{margin:0 0 6px;font-size:25px}.card p{margin:6px 0 12px;font-size:14px;line-height:1.4;opacity:.8}
.card input{display:block;box-sizing:border-box;width:100%;margin:0 0 8px;padding:10px;font:inherit;font-size:16px;border-radius:10px;border:1px solid var(--edge);background:var(--bg);color:var(--ink);user-select:text;-webkit-user-select:text}
.card ul{list-style:none;margin:0 0 12px;padding:0;text-align:left;font-size:14px}.card li{padding:5px 8px;border-bottom:1px solid var(--edge)}
#sw{margin:0 0 10px}#sw button{width:30px;height:30px;padding:0;margin:3px;border-radius:50%;border:3px solid transparent}#sw button.on{border-color:var(--ink)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.card #go{font:inherit;font-weight:700;font-size:16px;padding:12px 28px;border:0;border-radius:12px;background:var(--ball);color:#fff}.card #go:disabled{opacity:.5}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="lv"></span><span id="tm"></span><span id="ps"></span></div>
<div id="ov"><div class="card"><h1 id="h">Tilt Trail Race</h1><p id="msg"></p>
<div id="sw"></div><div id="inp"><input id="nm" maxlength="12" placeholder="Your name" autocomplete="off"><input id="rm" maxlength="20" placeholder="Room code (blank = solo)" autocomplete="off"></div>
<ul id="board"></ul><button id="go">Play</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const LV=[{name:'Oval Cup',loop:1,laps:3,k:1.4,w:.14,pc:3,seed:11,amp:.10},{name:'Twist Cup',loop:1,laps:3,k:1.8,w:.12,pc:5,seed:22,amp:.22},{name:'Snake Cup',loop:1,laps:3,k:2.2,w:.105,pc:7,seed:33,amp:.30},{name:'Long Sprint',loop:0,laps:1,k:3.6,w:.11,pc:7,seed:44}],PEN=5000,HUES=[4,28,50,140,190,215,270,320];
let W,H,PW,ox,S,dpr,lvl=0,worldH=1,path=[],halfW=40,ball=null,state='menu',cam=0,t0=0,time=0,pen=0,total=0,lastIdx=0,portals=[],noPortal=0,msgUntil=0,buf=new Map(),frozenUntil=0,startAt=0,doneT=0,ovOn=true,frame=0,tk=0;
let tilt={x:0,y:0},drag=null,keys={},myName='Player',myHue=HUES[Math.random()*8|0],code='';
let net=null,peer=null,hostConn=null,conns=[],others=new Map(),meSt={},myId='',lostHost=false,raceId=0,raceL=0,lastRace=null,lastStartT=0;
const r3=v=>Math.round(v*1000)/1000,num=v=>Number.isFinite(+v)?+v:0;
const hc=(h,l)=>'hsl('+((+h||0)%360)+',75%,'+(l||55)+'%)';
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function cr(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return[0,1].map(i=>.5*((2*p1[i])+(-p0[i]+p2[i])*t+(2*p0[i]-5*p1[i]+4*p2[i]-p3[i])*t2+(-p0[i]+3*p1[i]-3*p2[i]+p3[i])*t3))}
function build(){
 const L=LV[lvl];worldH=H*L.k;halfW=L.w*PW;const r=rng(L.seed*131+7);let Q=[];
 if(L.loop){const M=12,ph=r()*6.28;for(let j=0;j<M;j++){const a=-Math.PI/2+6.2832*j/M,f=1+L.amp*(Math.sin(2*a+ph)*.6+(r()-.5)*.8);Q.push([Math.max(.16,Math.min(.84,.5+.37*Math.cos(a)*f)),Math.max(.09,Math.min(.91,.5+.40*Math.sin(a)*f))])}}
 else{const rows=Math.round(L.k*7);Q.push([.5,.035]);for(let i=0;i<rows;i++)Q.push([(i%2?.8:.2)+(r()-.5)*.14,.09+.82*i/(rows-1)]);Q.push([.5,.965])}
 Q=Q.map(q=>[ox+q[0]*PW,q[1]*worldH]);const n=Q.length,lp=L.loop;path=[];
 for(let i=0;i<(lp?n:n-1);i++){const a=lp?Q[(i+n-1)%n]:Q[Math.max(i-1,0)],b=Q[i],c=lp?Q[(i+1)%n]:Q[i+1],d=lp?Q[(i+2)%n]:Q[Math.min(i+2,n-1)];for(let k=0;k<12;k++)path.push(cr(a,b,c,d,k/12))}
 if(!lp)path.push(Q[n-1]);
 portals=[];const N=path.length;
 for(let j=0;j<L.pc;j++){const idx=Math.floor(N*(.15+.7*(j+.2+.6*r())/L.pc)),back=Math.floor(N*(.07+.05*r())),a=path[idx-1],b=path[idx+1],tx=b[0]-a[0],ty=b[1]-a[1],l=Math.hypot(tx,ty)||1,sd=j%2?1:-1;
  portals.push({x:path[idx][0]-ty/l*sd*halfW*.45,y:path[idx][1]+tx/l*sd*halfW*.45,r:halfW*.42,idx,back})}}
function resize(){
 let nx,ny;if(ball){nx=(ball.x-ox)/PW;ny=ball.y/worldH}
 dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 PW=Math.min(W,H*.62);ox=(W-PW)/2;S=PW/400;build();
 if(ball){ball.x=ox+nx*PW;ball.y=ny*worldH;ball.r=11*S+3}}
function nearest(x,y){let best=1e9,bi=0,bx=0,by=0;const n=path.length,m=LV[lvl].loop?n:n-1;
 for(let i=0;i<m;i++){const[ax,ay]=path[i],[cx,cy]=path[(i+1)%n],dx=cx-ax,dy=cy-ay;let u=((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy||1);u=Math.max(0,Math.min(1,u));
  const px=ax+u*dx,py=ay+u*dy,d=Math.hypot(x-px,y-py);if(d<best){best=d;bi=(i+(u>.5?1:0))%n;bx=px;by=py}}
 return[best,bi,bx,by]}
function spawn(){const p=path[0];ball={x:p[0],y:p[1],vx:0,vy:0,r:11*S+3};cam=0}
const target=()=>LV[lvl].loop?LV[lvl].laps*path.length:path.length-1;
const prog=()=>Math.max(0,Math.min(1,total/Math.max(1,target())));
function pres(v){Object.assign(meSt,v)}
function beginRace(l){lvl=l;build();pen=0;total=0;lastIdx=0;noPortal=0;buf.clear();doneT=0;time=0;spawn();state='count';startAt=performance.now()+3000;
 pres({l:lvl,d:0,g:0,pn:0,f:0});show(false)}
function hostStart(l){const n=performance.now();if(n-lastStartT<1000)return;lastStartT=n;raceId++;raceL=l;beginRace(l)}
function requestRace(l){if(net==='host')hostStart(l);else if(net==='client'&&hostConn&&hostConn.open){[0,120,240].forEach(w=>setTimeout(()=>hostConn.open&&hostConn.send({t:'start',l}),w))}else beginRace(l)}
function show(on){ovOn=on;$('ov').style.display=on?'flex':'none'}
const sc=r=>r.d>0?2+1/(1+r.d):r.g;
function rows(){
 const a=[{n:myName,c:myHue,g:prog(),d:doneT,pn:pen,me:1}];
 others.forEach(o=>{if(o.n)a.push({n:o.n,c:o.c,g:o.g,d:o.d,pn:o.pn,me:0})});
 return a.sort((x,y)=>sc(y)-sc(x))}
function renderBoard(){const ul=$('board');ul.textContent='';if(state==='menu')return;
 if(net&&state==='lobby'){const n=rows().length;$('msg').textContent='Room '+code+': '+n+' player'+(n==1?'':'s')+' here. Friends open this same page and enter the same code. Anyone can press Start.'}
 rows().forEach((r,i)=>{const li=document.createElement('li'),dt=document.createElement('span');dt.className='dot';dt.style.background=hc(r.c);li.appendChild(dt);
  li.appendChild(document.createTextNode((state==='done'?(i+1)+'. ':'')+r.n+(r.me?' (you)':'')+' — '+(r.d>0?r.d.toFixed(1)+'s':state==='lobby'?'ready':Math.round(r.g*100)+'%')));ul.appendChild(li)})}
function card(h,msg,btn,menu){$('sw').style.display=menu||state==='lobby'?'block':'none';$('h').textContent=h;$('msg').textContent=msg;$('go').textContent=btn;$('go').disabled=false;$('inp').style.display=menu?'block':'none';renderBoard();show(true)}
function swatches(){const b=$('sw');b.textContent='';HUES.forEach(h=>{const x=document.createElement('button');x.style.background=hc(h);x.className=h===myHue?'on':'';x.onclick=()=>{myHue=h;pres({c:h});swatches();if(ovOn)renderBoard()};b.appendChild(x)})}
/* ---------- multiplayer (PeerJS): first player to use a code is the host ---------- */
function clean(s){s=s||{};return{t:performance.now(),q:num(s.q),u:num(s.u),v:num(s.v),n:String(s.n||'').slice(0,12),c:num(s.c),l:num(s.l),x:num(s.x),y:num(s.y),g:num(s.g),pn:num(s.pn),f:s.f?1:0,d:num(s.d)}}
function goLobby(h,msg){state='lobby';card(h,msg,'Start race',false)}
function fail(e){net=null;try{peer&&peer.destroy()}catch(_){}peer=null;goLobby('Solo race','Couldn\'t reach the multiplayer server ('+((e&&e.type)||'timeout')+'). You\'re racing solo.')}
function hostLost(){if(net!=='client')return;net=null;others=new Map();lostHost=true;if(state==='lobby'||state==='done')card('Host left','The host closed the game, so you\'re solo now. Reload to join again.','Start race',false)}
function newer(id,s,from){const o=from.get(id),n=clean(s);return o&&n.q<=o.q?o:n}
function onData(d){if(!d||d.t!=='all'||!d.p)return;
 const m=new Map();for(const k in d.p)if(k!==myId)m.set(k,newer(k,d.p[k],others));others=m;
 if(lastRace===null)lastRace=d.r;else if(d.r!==lastRace){lastRace=d.r;beginRace(num(d.l)%LV.length)}}
function onClient(c){
 c.on('open',()=>{conns.push(c);others.set(c.peer,clean({}))});
 c.on('data',d=>{if(!d)return;if(d.t==='st')others.set(c.peer,newer(c.peer,d.s,others));else if(d.t==='start')hostStart(num(d.l)%LV.length)});
 const gone=()=>{others.delete(c.peer);conns=conns.filter(x=>x!==c)};c.on('close',gone);c.on('error',gone)}
function joinAsClient(id){
 const cp=new Peer();let ok=false;const to=setTimeout(()=>{if(!ok)fail()},9000);
 cp.on('open',pid=>{myId=pid;const c=cp.connect(id,{reliable:false,serialization:'json'});
  c.on('open',()=>{ok=true;clearTimeout(to);peer=cp;net='client';hostConn=c;goLobby('Room '+code,'Joined!')});
  c.on('data',onData);c.on('close',hostLost);c.on('error',()=>{if(!ok){clearTimeout(to);fail()}})});
 cp.on('error',e=>{if(!ok){clearTimeout(to);fail(e)}})}
function connect(){
 const id='ttrace-v1-'+code,hp=new Peer(id);let settled=false;
 const to=setTimeout(()=>{if(!settled){settled=true;fail()}},9000);
 hp.on('open',()=>{if(settled)return;settled=true;clearTimeout(to);peer=hp;net='host';myId='host';others=new Map();conns=[];hp.on('connection',onClient);goLobby('Room '+code,'You\'re the host.')});
 hp.on('error',e=>{if(settled)return;settled=true;clearTimeout(to);try{hp.destroy()}catch(_){}
  if(e&&e.type==='unavailable-id')joinAsClient(id);else fail(e)})}
function doJoin(){
 myName=($('nm').value.trim()||'Player').slice(0,12);code=$('rm').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
 meSt={n:myName,c:myHue,l:lvl,x:0,y:0,g:0,pn:0,f:0,d:0,u:0,v:0,q:0};lastRace=null;raceId=0;
 if(!code){goLobby('Solo race','Race the clock!');return}
 if(typeof Peer==='undefined'){goLobby('Solo race','Couldn\'t load the multiplayer library, so you\'re racing solo.');return}
 $('go').disabled=true;$('msg').textContent='Connecting to room '+code+'…';connect()}
setInterval(()=>{if(!net)return;meSt.q=(meSt.q||0)+1;
 if(net==='client'){if(hostConn&&hostConn.open)hostConn.send({t:'st',s:meSt})}
 else{const all={host:meSt};others.forEach((v,k)=>all[k]=v);conns.forEach(c=>c.open&&c.send({t:'all',p:all,r:raceId,l:raceL}))}
 if(ovOn&&++tk%8==0)renderBoard()},33);
/* ---------- input ---------- */
$('go').onclick=()=>{if(state==='menu')doJoin();else if(state==='lobby')requestRace(lvl);else if(state==='done')requestRace((lvl+1)%LV.length)};
addEventListener('pointerdown',e=>{if(!ovOn)drag=[e.clientX,e.clientY]});
addEventListener('pointermove',e=>{if(drag){tilt.x=Math.max(-1.5,Math.min(1.5,(e.clientX-drag[0])/70));tilt.y=Math.max(-1.5,Math.min(1.5,(e.clientY-drag[1])/70))}});
addEventListener('pointerup',()=>{drag=null;tilt.x=tilt.y=0});
addEventListener('keydown',e=>{if(!ovOn)keys[e.key]=1});addEventListener('keyup',e=>keys[e.key]=0);
addEventListener('resize',resize);
/* ---------- game loop ---------- */
function step(){
 const now=performance.now();frame++;
 if(!drag){tilt.x=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);tilt.y=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0)}
 if(state==='count'&&now>=startAt){state='play';t0=now}
 if(state==='frozen'&&now>=frozenUntil)state='play';
 if(state==='play'){
  ball.vx+=tilt.x*.32*S;ball.vy+=tilt.y*.32*S;ball.vx*=.985;ball.vy*=.985;
  const m=9*S,sp=Math.hypot(ball.vx,ball.vy);if(sp>m){ball.vx*=m/sp;ball.vy*=m/sp}
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x<ox+ball.r||ball.x>ox+PW-ball.r){ball.x=Math.max(ox+ball.r,Math.min(ox+PW-ball.r,ball.x));ball.vx*=-.4}
  if(ball.y<ball.r||ball.y>worldH-ball.r){ball.y=Math.max(ball.r,Math.min(worldH-ball.r,ball.y));ball.vy*=-.4}
  const[d,i,px,py]=nearest(ball.x,ball.y),L=LV[lvl],NN=path.length;let df=i-lastIdx;if(L.loop){if(df>NN/2)df-=NN;else if(df<-NN/2)df+=NN}
  if(Math.abs(df)<25){total+=df;lastIdx=i}
  if(now>noPortal)for(const p of portals)if(Math.hypot(ball.x-p.x,ball.y-p.y)<p.r+ball.r*.55){const tg=Math.max(0,p.idx-p.back);ball.x=path[tg][0];ball.y=path[tg][1];ball.vx=ball.vy=0;lastIdx=tg;total-=p.back;noPortal=now+800;msgUntil=now+1500;navigator.vibrate&&navigator.vibrate([60,40,60]);break}
  if(d>halfW+ball.r*.2){const k=halfW*.92/(d||1);ball.x=px+(ball.x-px)*k;ball.y=py+(ball.y-py)*k;ball.vx=ball.vy=0;pen++;state='frozen';frozenUntil=now+PEN;navigator.vibrate&&navigator.vibrate(120)}
  const e=path[path.length-1];
  if(L.loop?total>=target():Math.hypot(ball.x-e[0],ball.y-e[1])<halfW*.7){state='done';doneT=+((now-t0)/1000).toFixed(2);total=target();pres({d:doneT,g:1,pn:pen});navigator.vibrate&&navigator.vibrate([40,40,40]);
   card('Finished!','Time '+doneT.toFixed(1)+'s with '+pen+' penalt'+(pen==1?'y':'ies')+'.','Next race',false)}}
 if(ball&&(state==='play'||state==='frozen'))time=(now-t0)/1000;
 {const L=LV[lvl];$('lv').textContent=state==='menu'||state==='lobby'?'':L.loop?'Lap '+Math.min(L.laps,Math.max(0,Math.floor(total/path.length))+1)+'/'+L.laps:'Sprint'}
 if(ball&&(state==='count'||state==='play'||state==='frozen'||state==='done'))pres({x:r3((ball.x-ox)/PW),y:r3(ball.y/worldH),g:r3(prog()),pn:pen,f:state==='frozen'?1:0,u:state==='play'?r3(ball.vx*60/PW):0,v:state==='play'?r3(ball.vy*60/worldH):0});
 if(ball){const tg=Math.max(0,Math.min(worldH-H,ball.y-H*.5));cam+=(tg-cam)*.15}
 $('tm').textContent=state==='play'||state==='frozen'?time.toFixed(1)+'s':'';
 let ps=pen?pen+' pen':'';if(lostHost)ps='host left'+(ps?' · '+ps:'');
 if(net&&(state==='play'||state==='frozen')){const a=rows(),me=sc({g:prog(),d:doneT});ps=(1+a.filter(r=>sc(r)>me&&!r.me).length)+'/'+a.length+(ps?' · '+ps:'')}
 $('ps').textContent=ps}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function dot(x,y,r,fill,a){ctx.globalAlpha=a||1;ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,Math.max(r,0),0,7);ctx.fill();ctx.globalAlpha=1}
function samplePos(id,q,nt){
 let b=buf.get(id);if(!b){b=[];buf.set(id,b)}const last=b[b.length-1];
 if(!last||last.q!==q.q){if(last&&Math.hypot((q.x-last.x)*PW,(q.y-last.y)*worldH)>PW*.4)b.length=0;b.push({q:q.q,t:q.t,x:q.x,y:q.y});if(b.length>12)b.shift()}
 const rt=nt-110;if(b.length===1||rt<=b[0].t)return b[0];
 for(let i=b.length-1;i>0;i--){const A=b[i-1],B=b[i];if(A.t<=rt){if(rt>=B.t){const ag=Math.min(.12,(rt-B.t)/1000);return{x:B.x+q.u*ag,y:B.y+q.v*ag}}const f=(rt-A.t)/(B.t-A.t);return{x:A.x+(B.x-A.x)*f,y:A.y+(B.y-A.y)*f}}}
 return b[0]}
function draw(){
 ctx.clearRect(0,0,W,H);if(!path.length)return;ctx.save();ctx.translate(0,-cam);
 ctx.lineCap=ctx.lineJoin='round';ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(LV[lvl].loop)ctx.closePath();
 ctx.strokeStyle=css('--edge');ctx.lineWidth=halfW*2+6;ctx.stroke();ctx.strokeStyle=css('--track');ctx.lineWidth=halfW*2;ctx.stroke();
 const e=path[path.length-1],g=css('--goal'),nt=performance.now();
 if(LV[lvl].loop){const a=path[1],b=path[path.length-1];ctx.save();ctx.translate(path[0][0],path[0][1]);ctx.rotate(Math.atan2(a[1]-b[1],a[0]-b[0]));const sq=halfW/4;
  for(let k=-4;k<4;k++)for(let c=0;c<2;c++){ctx.fillStyle=(k+c)%2?'#fff':'#222';ctx.fillRect(c*sq-sq,k*sq,sq,sq)}ctx.restore()}
 else{dot(e[0],e[1],halfW*.7,g,.3);ctx.strokeStyle=g;ctx.lineWidth=3;ctx.beginPath();ctx.arc(e[0],e[1],halfW*.7,0,7);ctx.stroke()}
 for(const p of portals){const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);gr.addColorStop(0,'#000');gr.addColorStop(.6,'#4b1d8f');gr.addColorStop(1,'#b36bff');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  ctx.setLineDash([7,6]);ctx.lineDashOffset=-nt/25;ctx.strokeStyle='#ecd6ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.r*.78,0,7);ctx.stroke();ctx.setLineDash([])}
 if(net&&ball&&state!=='menu'&&state!=='lobby'){ctx.font='600 12px system-ui';ctx.textAlign='center';
  for(const[id,q]of others){if(!q.n||q.l!==lvl)continue;const sp=samplePos(id,q,nt),x=ox+sp.x*PW,y=sp.y*worldH,col=hc(q.c);
   dot(x,y,ball.r,col,.7);if(q.f){ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,ball.r+4,0,7);ctx.stroke()}
   ctx.fillStyle=css('--ink');ctx.fillText(q.n,x,y-ball.r-6)}}
 if(ball){const r=ball.r,fz=state==='frozen';dot(ball.x+3,ball.y+4,r,'#000',.2);
  const gr=ctx.createRadialGradient(ball.x-r*.3,ball.y-r*.3,r*.1,ball.x,ball.y,r);gr.addColorStop(0,fz?'#e0e4ec':hc(myHue,80));gr.addColorStop(1,fz?'#8791a5':hc(myHue,50));
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(ball.x,ball.y,r,0,7);ctx.fill();
  if(fz){const rem=Math.max(0,frozenUntil-performance.now())/PEN;ctx.strokeStyle='#4aa3ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(ball.x,ball.y,r+7,-Math.PI/2,-Math.PI/2+6.283*rem);ctx.stroke()}}
 ctx.restore();ctx.textAlign='center';ctx.fillStyle=css('--ink');
 if(state==='count'){ctx.font='700 90px system-ui';ctx.fillText(Math.max(1,Math.ceil((startAt-performance.now())/1000)),W/2,H*.3);ctx.font='600 18px system-ui';ctx.fillText(LV[lvl].name+(LV[lvl].loop?' · '+LV[lvl].laps+' laps':''),W/2,H*.3+34)}
 if(performance.now()<msgUntil){ctx.font='700 22px system-ui';ctx.fillStyle='#b36bff';ctx.fillText('Portal! Sent back',W/2,H*.2+(state==='frozen'?32:0))}
 if(state==='frozen'){ctx.font='700 22px system-ui';ctx.fillText('Frozen '+((frozenUntil-performance.now())/1000).toFixed(1)+'s',W/2,H*.2)}}
swatches();resize();
